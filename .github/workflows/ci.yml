name: CI

on:
  push:
    branches: [main, poc-pro]
  pull_request:

# une nouvelle exécution annule la précédente sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  frontend:
    name: Frontend (build + tests Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Tests (Chrome headless)
        run: CHROME_BIN="$(which google-chrome)" npm test

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image unique (Dockerfile racine)
        run: docker build -t recherche .
      - name: Images docker compose (backend + frontend)
        run: docker compose build
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name recherche -p 8000:8000 recherche
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs recherche
          exit 1
      - name: L'interface est servie sur /
        run: curl -fsS http://localhost:8000/ | grep -q "<app-root>"

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les documents de cours — Préing et Ing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1 class="brand"><span class="glyph" aria-hidden="true">C</span>
    <span class="title">Les documents de cours<small id="curriculum">Préing et Ing — semestres 1 et 2</small></span></h1>
  <div id="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Une notion, un exercice, un chapitre…" autofocus aria-label="Question" autocomplete="off">
    <kbd title="Raccourci clavier">/</kbd>
    <button id="go">Rechercher</button>
  </div>
  <div class="top-actions">
  <button id="browse" aria-haspopup="dialog" title="Parcourir les fichiers (raccourci : b)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>Fichiers</span>
  </button>
  <button id="theme" aria-label="Changer de thème" title="Thème clair / sombre">
    <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
  </div>
</header>

<dialog id="browser" aria-labelledby="browser-title">
  <div class="browser-head">
    <h2 id="browser-title">Parcourir les fichiers</h2>
    <input id="browser-filter" type="search" placeholder="Filtrer les documents…" aria-label="Filtrer les documents" autocomplete="off">
    <button id="browser-close" aria-label="Fermer">×</button>
  </div>
  <div class="browser-body">
    <nav id="browser-courses" aria-label="Matières"></nav>
    <div id="browser-docs" aria-live="polite"></div>
  </div>
</dialog>

<div class="layout">
  <aside id="aside">
    <button id="toggle-filters" aria-expanded="false"><span>Où chercher : <b id="scope-summary">toutes les matières</b></span></button>
    <div id="filters">
      <fieldset>
        <legend>Cycle</legend>
        <div class="chips" id="programs"></div>
      </fieldset>
      <fieldset>
        <legend>Année dans le cycle</legend>
        <div class="chips" id="study-years"></div>
      </fieldset>
      <fieldset>
        <legend>Semestre</legend>
        <div class="chips" id="semesters"></div>
      </fieldset>
      <fieldset id="track-field" hidden>
        <legend>Parcours</legend>
        <div class="chips" id="tracks"></div>
      </fieldset>
      <fieldset>
        <legend>Matières</legend>
        <div class="courses" id="courses"></div>
      </fieldset>
      <fieldset>
        <legend>Type de document</legend>
        <div class="chips" id="kinds"></div>
      </fieldset>
      <fieldset>
        <legend>Énoncés ou corrigés</legend>
        <div class="chips" id="versions"></div>
      </fieldset>
      <fieldset>
        <legend>Années scolaires</legend>
        <div class="chips" id="years"></div>
      </fieldset>
      <fieldset>
        <legend>Nombre de résultats</legend>
        <div class="chips" id="ks"></div>
      </fieldset>
      <fieldset>
        <label class="switch"><input type="checkbox" id="recent" checked>
          <span>Favoriser les plus récents<small>à pertinence proche, le document le plus récent passe devant</small></span></label>
      </fieldset>
      <button id="reset">Tout réinitialiser</button>
    </div>
  </aside>

  <main id="results"><p class="hint">Chargement des cours…</p></main>
</div>

<script defer src="/app.js"></script>
</body>
</html>

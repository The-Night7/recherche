<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les documents de maths — recherche dans les cours</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg:#161821; --panel:#1e2130; --panel2:#242840; --ink:#eef0f8;
    --ink-soft:#9a9fc0; --accent:#8b9bff; --accent2:#c79bff;
    --border:#31354d; --score:#5fd0a0; --warn:#f0b86a;
    --rn:#8b9bff; --series:#e9a3d8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI', system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  ::selection{ background:#4a4420; color:#ffe08a; }
  button,input,select{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  header{
    padding:22px 24px 18px; border-bottom:1px solid var(--border);
    display:grid; grid-template-columns:260px 1fr; gap:28px; align-items:center;
  }
  header h1{ margin:0; font-size:18px; font-weight:600; line-height:1.3; }
  header h1 small{ display:block; color:var(--ink-soft); font-weight:400; font-size:12.5px; margin-top:3px; }
  #searchbar{ display:flex; gap:10px; max-width:760px; }
  #q{
    flex:1; min-width:0; padding:12px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); font-size:15px;
  }
  #q:focus{ outline:none; border-color:var(--accent); }
  #go{
    padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#12131c; font-weight:600; font-size:14px;
  }
  #go:hover{ opacity:.9; }

  .layout{ display:grid; grid-template-columns:260px 1fr; gap:28px; padding:22px 24px 60px; }

  /* ---- panneau "où chercher" ---- */
  aside{ position:sticky; top:16px; align-self:start; }
  #toggle-filters{ display:none; }
  fieldset{ border:none; margin:0 0 22px; padding:0; }
  legend{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; padding:0; }

  .courses{ display:flex; flex-direction:column; gap:6px; }
  .course{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer;
  }
  .course .sym{
    width:34px; height:34px; border-radius:8px; display:grid; place-items:center;
    font-family:'Georgia','Liberation Serif',serif; font-size:19px;
    background:var(--panel2); color:var(--ink-soft); flex:none;
  }
  .course .name{ font-size:14px; line-height:1.25; }
  .course .name small{ display:block; color:var(--ink-soft); font-size:11.5px; }
  .course[aria-pressed="true"]{ border-color:var(--c, var(--accent)); background:var(--panel2); }
  .course[aria-pressed="true"] .sym{ background:var(--c, var(--accent)); color:#15161f; }
  .course[data-id="analyse-rn"]{ --c:var(--rn); }
  .course[data-id="series"]{ --c:var(--series); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    padding:6px 11px; border-radius:999px; border:1px solid var(--border);
    background:transparent; cursor:pointer; font-size:13px; color:var(--ink-soft);
  }
  .chip[aria-pressed="true"]{ background:var(--panel2); color:var(--ink); border-color:var(--accent); }
  .chip:disabled{ opacity:.35; cursor:default; }

  .switch{ display:flex; align-items:center; gap:10px; font-size:13.5px; cursor:pointer; }
  .switch input{ width:16px; height:16px; accent-color:var(--accent); }
  .switch small{ display:block; color:var(--ink-soft); font-size:11.5px; }
  #reset{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px;
    text-decoration:underline; cursor:pointer; padding:0;
  }

  /* ---- résultats ---- */
  #results{ max-width:760px; min-width:0; }
  .count{ color:var(--ink-soft); font-size:12.5px; margin:0 0 14px; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:18px 22px 20px; margin-bottom:16px; border-left:3px solid var(--c, var(--accent));
  }
  .card[data-course="analyse-rn"]{ --c:var(--rn); }
  .card[data-course="series"]{ --c:var(--series); }
  .card-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .doc{ font-size:12.5px; color:var(--ink-soft); margin-bottom:3px; }
  .doc b{ color:var(--c); font-weight:600; }
  .tag{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; margin-left:6px;
        background:#3a2f1c; color:var(--warn); vertical-align:1px; }
  .section{ font-weight:600; font-size:14.5px; }
  .score{ font-size:11px; color:var(--score); white-space:nowrap; background:#1a2b24; padding:3px 8px; border-radius:999px; }

  .prose{
    margin:0 0 12px; font-family:'Georgia','Liberation Serif', serif;
    font-size:15.5px; line-height:1.75;
  }
  .prose:last-child{ margin-bottom:0; }
  .md h4{ font-family:'Segoe UI',system-ui,sans-serif; font-size:13.5px; color:var(--accent2); margin:14px 0 6px; }
  .md{ font-family:'Georgia','Liberation Serif','DejaVu Serif', serif; font-size:15.5px; line-height:1.75; }
  .md ul, .md ol{ margin:0 0 12px; padding-left:22px; font:inherit; }
  .md li{ margin:3px 0; font:inherit; }
  .katex{ font-size:1.05em; }
  .katex-display{ overflow-x:auto; overflow-y:hidden; padding:4px 0; }

  .formula{
    margin:10px 0; padding:10px 14px; background:var(--panel2);
    border-left:3px solid var(--accent); border-radius:6px; overflow-x:auto;
  }
  .formula pre{
    margin:0; white-space:pre-wrap; word-break:break-word;
    font-family:'Cascadia Code','Fira Code', ui-monospace, monospace;
    font-size:13.5px; line-height:1.6; color:#d6d9ff;
  }
  mark{ background:#4a4420; color:#ffe08a; border-radius:3px; padding:0 2px; }
  .empty, .hint{ color:var(--ink-soft); font-size:14px; margin-top:30px; line-height:1.6; }
  .hint b{ color:var(--ink); font-weight:600; }

  @media (max-width: 820px){
    header, .layout{ grid-template-columns:1fr; gap:14px; }
    aside{ position:static; }
    #toggle-filters{
      display:block; width:100%; padding:10px 12px; border-radius:10px; text-align:left;
      background:var(--panel); border:1px solid var(--border); font-size:13.5px; cursor:pointer;
    }
    #filters{ display:none; margin-top:14px; }
    aside.open #filters{ display:block; }
  }
</style>
</head>
<body>
<header>
  <h1>∫ Les documents de maths <small>Recherche TF-IDF codée à la main (NumPy)</small></h1>
  <div id="searchbar">
    <input id="q" type="search" placeholder="Ex : critère de d'Alembert, rayon de convergence, norme…" autofocus aria-label="Question">
    <button id="go">Rechercher</button>
  </div>
</header>

<div class="layout">
  <aside id="aside">
    <button id="toggle-filters" aria-expanded="false">Où chercher : <span id="scope-summary">tous les cours</span></button>
    <div id="filters">
      <fieldset>
        <legend>Chercher dans</legend>
        <div class="courses" id="courses"></div>
      </fieldset>
      <fieldset>
        <legend>Type de document</legend>
        <div class="chips" id="kinds"></div>
      </fieldset>
      <fieldset>
        <legend>Énoncés ou corrigés</legend>
        <div class="chips" id="versions"></div>
      </fieldset>
      <fieldset>
        <legend>Années scolaires</legend>
        <div class="chips" id="years"></div>
      </fieldset>
      <fieldset>
        <legend>Nombre de résultats</legend>
        <div class="chips" id="ks"></div>
      </fieldset>
      <fieldset>
        <label class="switch"><input type="checkbox" id="recent" checked>
          <span>Favoriser les plus récents<small>à pertinence proche, le document le plus récent passe devant</small></span></label>
      </fieldset>
      <button id="reset">Tout réinitialiser</button>
    </div>
  </aside>

  <main id="results"><p class="hint">Chargement des cours…</p></main>
</div>

<script>
const $ = id => document.getElementById(id);
const COURSE_SYM = { "analyse-rn": "ℝⁿ", "series": "Σ" };
const DEFAULT = () => ({ course: "all", kinds: [], versions: [], years: [], k: 5, recent: true });
let META = null;
let state = DEFAULT();

try { Object.assign(state, JSON.parse(localStorage.getItem("tuteur-filtres") || "{}")); } catch (e) {}
function save(){ try { localStorage.setItem("tuteur-filtres", JSON.stringify(state)); } catch (e) {} }

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ---------- panneau de filtres ---------- */
function chip(label, pressed, onClick, disabled){
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.disabled = !!disabled;
  b.onclick = onClick;
  return b;
}
function toggleIn(list, v){ const i = list.indexOf(v); i < 0 ? list.push(v) : list.splice(i, 1); }

function coursesInScope(){
  return state.course === "all" ? META.courses : META.courses.filter(c => c.id === state.course);
}

function renderFilters(){
  // cours
  const box = $("courses"); box.innerHTML = "";
  const total = META.courses.reduce((s, c) => s + c.count, 0);
  const entries = [{ id: "all", name: "Tous les cours", count: total }, ...META.courses];
  entries.forEach(c => {
    const b = document.createElement("button");
    b.className = "course"; b.dataset.id = c.id;
    b.setAttribute("aria-pressed", state.course === c.id ? "true" : "false");
    b.innerHTML = `<span class="sym">${c.id === "all" ? "∗" : COURSE_SYM[c.id] || "·"}</span>
      <span class="name">${escapeHtml(c.name)}<small>${c.count} passages</small></span>`;
    b.onclick = () => { state.course = c.id; state.years = []; update(); };
    box.appendChild(b);
  });

  // types : on grise ceux absents du/des cours choisis
  const scope = coursesInScope();
  const kinds = $("kinds"); kinds.innerHTML = "";
  Object.entries(META.kinds).forEach(([id, label]) => {
    const n = scope.reduce((s, c) => s + (c.kinds[id] || 0), 0);
    kinds.appendChild(chip(label, state.kinds.includes(id), () => { toggleIn(state.kinds, id); update(); }, n === 0));
  });

  const versions = $("versions"); versions.innerHTML = "";
  [["enonce", "Énoncés"], ["corrige", "Corrigés"]].forEach(([id, label]) =>
    versions.appendChild(chip(label, state.versions.includes(id), () => { toggleIn(state.versions, id); update(); })));

  // années du/des cours choisis, la plus récente d'abord
  const years = [...new Set(scope.flatMap(c => c.years))].sort((a, b) => (b ?? 0) - (a ?? 0));
  const yb = $("years"); yb.innerHTML = "";
  years.forEach(y => {
    const id = y === null ? "none" : String(y);
    const label = y === null ? "sans date" : `${y}-${String(y + 1).slice(2)}`;
    yb.appendChild(chip(label, state.years.includes(id), () => { toggleIn(state.years, id); update(); }));
  });

  const ks = $("ks"); ks.innerHTML = "";
  [3, 5, 10].forEach(k => ks.appendChild(chip(String(k), state.k === k, () => { state.k = k; update(); })));

  $("recent").checked = state.recent;

  // résumé (mobile)
  const parts = [state.course === "all" ? "tous les cours" : META.courses.find(c => c.id === state.course)?.name];
  if (state.kinds.length) parts.push(state.kinds.map(k => META.kinds[k]).join("+"));
  if (state.versions.length === 1) parts.push(state.versions[0] === "corrige" ? "corrigés" : "énoncés");
  if (state.years.length) parts.push(state.years.length + " année(s)");
  $("scope-summary").textContent = parts.join(", ");
}

function update(){
  save(); renderFilters();
  if ($("q").value.trim()) doSearch();
}

/* ---------- rendu des passages ---------- */
// sépare le texte en morceaux maths ($$…$$, $…$, \(…\), \[…\]) et texte ordinaire
const MATH_RE = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(?:\\\$|[^$\n])+?\$)/g;

function highlightPlain(text, terms){
  let html = escapeHtml(text);
  terms.forEach(t => {
    if (t.length < 3) return;
    const re = /\d$/.test(t)
      ? new RegExp('(' + reEscape(t).replace(/ /g, '\\s+') + ')(?!\\d)', 'gi')   // "exercice 2" ≠ "exercice 21"
      : new RegExp('(' + reEscape(t) + '[\\wÀ-ÿ]*)', 'gi');
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}
function inlineMd(html){
  return html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
}
// texte + surlignage, sans toucher aux formules (KaTeX les rend ensuite)
function richText(text, terms){
  return text.split(MATH_RE).map((part, i) =>
    i % 2 ? escapeHtml(part) : inlineMd(highlightPlain(part, terms))
  ).join('');
}
// mini-Markdown : titres, listes, paragraphes
function renderMd(text, terms){
  const out = []; let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  text.split(/\n\s*\n/).forEach(para => {
    const lines = para.split('\n');
    if (lines.every(l => /^\s*([-*]|\d+[.)])\s+/.test(l) || /^\s{2,}\S/.test(l))) {
      lines.forEach(l => {
        const m = l.match(/^\s*([-*]|\d+[.)])\s+(.*)$/);
        if (!m) { if (out.length) out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ' ' + richText(l.trim(), terms) + '</li>'); return; }
        const tag = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (list !== tag) {
          closeList(); list = tag;
          out.push(tag === 'ol' ? `<ol start="${parseInt(m[1], 10) || 1}">` : '<ul>');
        }
        out.push(`<li>${richText(m[2], terms)}</li>`);
      });
      return;
    }
    closeList();
    const h = para.match(/^#{1,6}\s+(.*)$/);
    if (h && lines.length === 1) { out.push(`<h4>${richText(h[1].replace(/\*\*/g, ''), terms)}</h4>`); return; }
    out.push(`<p class="prose">${richText(para.replace(/\n/g, ' '), terms)}</p>`);
  });
  closeList();
  return `<div class="md">${out.join('')}</div>`;
}

function renderMath(el){
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  }
}

function renderCard(r, i, tokens){
  const body = r.blocks.map(b => {
    if (b.type === "md") return renderMd(b.text, tokens);
    if (b.type === "formula") return `<div class="formula"><pre>${escapeHtml(b.text)}</pre></div>`;
    return `<p class="prose">${highlightPlain(b.text, tokens)}</p>`;
  }).join('');
  return `
    <article class="card" data-course="${r.course}">
      <div class="card-head">
        <div>
          <div class="doc"><b>${escapeHtml(r.course_name)}</b>, ${escapeHtml(r.doc_label)}${r.corrige ? '<span class="tag">corrigé</span>' : ''}</div>
          <div class="section">${escapeHtml(r.section || r.label)}</div>
        </div>
        <span class="score" title="${r.score >= 1 ? 'référence exacte (1 + cosinus des autres mots)' : 'similarité cosinus'}${state.recent ? ' × bonus de récence' : ''}">${r.score.toFixed(3)}</span>
      </div>
      ${body}
    </article>`;
}

/* ---------- recherche ---------- */
async function doSearch(){
  const q = $("q").value.trim();
  if (!q) return;
  const p = new URLSearchParams({ q, k: state.k, recent: state.recent ? 1 : 0 });
  if (state.course !== "all") p.set("course", state.course);
  if (state.kinds.length) p.set("kinds", state.kinds.join(","));
  if (state.versions.length) p.set("versions", state.versions.join(","));
  if (state.years.length) p.set("years", state.years.join(","));
  $("results").innerHTML = '<p class="hint">Recherche…</p>';
  try {
    const data = await (await fetch('/api/search?' + p)).json();
    if (data.error) { $("results").innerHTML = `<p class="empty">${escapeHtml(data.error)}</p>`; return; }
    if (!data.tokens.length) { $("results").innerHTML = '<p class="empty">Question trop courte : ajoute un mot du cours (3 lettres ou plus).</p>'; return; }
    if (!data.results.length) {
      $("results").innerHTML = `<p class="empty">Aucun passage trouvé pour <b>${data.tokens.map(escapeHtml).join(', ')}</b> avec ces filtres.
        Élargis la recherche (autre cours, plus de types ou d'années) ou reformule avec le vocabulaire du cours.</p>`;
      return;
    }
    const hl = data.highlight || data.tokens;
    const ref = data.reference
      ? ` · référence : <b>${escapeHtml(data.reference)}</b>${data.relaxed ? ' <span style="color:var(--warn)">(exercice introuvable, document entier)</span>' : ''}`
      : '';
    $("results").innerHTML = `<p class="count">${data.results.length} passage(s) sur ${data.searched} dans la sélection${ref}</p>` +
      data.results.map((r, i) => renderCard(r, i, hl)).join('');
    renderMath($("results"));
  } catch (e) {
    $("results").innerHTML = '<p class="empty">Le serveur ne répond pas. Lance <b>python3 server.py</b> puis recharge la page.</p>';
  }
}

$("go").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("recent").onchange = e => { state.recent = e.target.checked; update(); };
$("reset").onclick = () => { state = DEFAULT(); update(); };
$("toggle-filters").onclick = () => {
  const open = $("aside").classList.toggle("open");
  $("toggle-filters").setAttribute("aria-expanded", open);
};

fetch('/api/meta').then(r => r.json()).then(meta => {
  META = meta;
  if (state.course !== "all" && !META.courses.some(c => c.id === state.course)) state.course = "all";
  renderFilters();
  $("results").innerHTML = `<p class="hint">Choisis <b>où chercher</b> à gauche (un cours, des TD, les DS d'une année…), puis tape ta question et Entrée.</p>`;
}).catch(() => {
  $("results").innerHTML = '<p class="empty">Le serveur ne répond pas. Lance <b>python3 server.py</b> puis recharge la page.</p>';
});
</script>
</body>
</html>

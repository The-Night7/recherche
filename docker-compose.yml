services:
  backend:
    build: ./backend
    environment:
      PORT: 8000
      WEB_DIR: none
    volumes:
      - pagecache:/app/.pagecache
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pagecache:

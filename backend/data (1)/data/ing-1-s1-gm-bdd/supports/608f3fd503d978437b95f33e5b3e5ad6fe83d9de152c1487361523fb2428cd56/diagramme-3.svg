<svg width="1200" height="950" viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg">
                        <!-- EMPLOYE (top center) -->
                        <rect class="entity" x="480" y="30" width="220" height="120" rx="5"/>
                        <text class="entity-text" x="590" y="55" text-anchor="middle">EMPLOYE</text>
                        <line x1="480" y1="65" x2="700" y2="65" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="490" y="80">#num_employe</text>
                        <text class="attribute-text" x="490" y="95">nom, prenom</text>
                        <text class="attribute-text" x="490" y="110">adresse</text>
                        <text class="attribute-text" x="490" y="125">telephone</text>
                        
                        <!-- DOCTEUR (top left) -->
                        <rect class="entity" x="150" y="230" width="200" height="90" rx="5"/>
                        <text class="entity-text" x="250" y="255" text-anchor="middle">DOCTEUR</text>
                        <line x1="150" y1="265" x2="350" y2="265" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="160" y="280">#num_employe</text>
                        <text class="attribute-text" x="160" y="295">specialite</text>
                        
                        <!-- INFIRMIER (top right) -->
                        <rect class="entity" x="850" y="230" width="200" height="90" rx="5"/>
                        <text class="entity-text" x="950" y="255" text-anchor="middle">INFIRMIER</text>
                        <line x1="850" y1="265" x2="1050" y2="265" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="860" y="280">#num_employe</text>
                        <text class="attribute-text" x="860" y="295">rotation</text>
                        
                        <!-- Héritage lines -->
                        <line class="relation-line" x1="540" y1="150" x2="250" y2="230" stroke-dasharray="5,5"/>
                        <text x="350" y="180" style="font-size: 11px; fill: #1976d2;">hérite</text>
                        <line class="relation-line" x1="640" y1="150" x2="950" y2="230" stroke-dasharray="5,5"/>
                        <text x="800" y="180" style="font-size: 11px; fill: #1976d2;">hérite</text>
                        
                        <!-- SERVICE -->
                        <rect class="entity" x="480" y="400" width="220" height="110" rx="5"/>
                        <text class="entity-text" x="590" y="425" text-anchor="middle">SERVICE</text>
                        <line x1="480" y1="435" x2="700" y2="435" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="490" y="450">#code_service</text>
                        <text class="attribute-text" x="490" y="465">nom</text>
                        <text class="attribute-text" x="490" y="480">batiment</text>
                        
                        <!-- SALLE -->
                        <rect class="entity" x="850" y="550" width="220" height="110" rx="5"/>
                        <text class="entity-text" x="960" y="575" text-anchor="middle">SALLE</text>
                        <line x1="850" y1="585" x2="1070" y2="585" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="860" y="600">#code_service</text>
                        <text class="attribute-text primary-key" x="860" y="615">#num_salle</text>
                        <text class="attribute-text" x="860" y="630">nb_lits</text>
                        
                        <!-- PATIENT -->
                        <rect class="entity" x="50" y="700" width="200" height="100" rx="5"/>
                        <text class="entity-text" x="150" y="725" text-anchor="middle">PATIENT</text>
                        <line x1="50" y1="735" x2="250" y2="735" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="60" y="750">#id_patient</text>
                        <text class="attribute-text" x="60" y="765">nom</text>
                        <text class="attribute-text" x="60" y="780">adresse</text>
                        
                        <!-- DOSSIER -->
                        <rect class="entity" x="450" y="700" width="200" height="100" rx="5"/>
                        <text class="entity-text" x="550" y="725" text-anchor="middle">DOSSIER</text>
                        <line x1="450" y1="735" x2="650" y2="735" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="460" y="750">#id_dossier</text>
                        <text class="attribute-text" x="460" y="765">date_creation</text>
                        
                        <!-- MALADIE -->
                        <rect class="entity" x="850" y="750" width="220" height="100" rx="5"/>
                        <text class="entity-text" x="960" y="775" text-anchor="middle">MALADIE</text>
                        <line x1="850" y1="785" x2="1070" y2="785" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="860" y="800">#code_maladie</text>
                        <text class="attribute-text" x="860" y="815">nom</text>
                        <text class="attribute-text" x="860" y="830">description</text>
                        
                        <!-- DIRIGE Association -->
                        <path class="association" d="M 380 340 L 430 320 L 480 340 L 430 360 Z"/>
                        <text class="association-text" x="430" y="345" text-anchor="middle">DIRIGE</text>
                        
                        <!-- AFFECTE_A Association -->
                        <path class="association" d="M 780 400 L 830 380 L 880 400 L 830 420 Z"/>
                        <text class="association-text" x="830" y="395" text-anchor="middle">AFFECTE_A</text>
                        <text class="association-text" x="830" y="410" text-anchor="middle"/>
                        
                        <!-- SURVEILLE Association -->
                        <path class="association" d="M 960 400 L 1010 380 L 1060 400 L 1010 420 Z"/>
                        <text class="association-text" x="1010" y="405" text-anchor="middle">SURVEILLE</text>
                        
                        <!-- CONTIENT Association -->
                        <path class="association" d="M 730 520 L 780 500 L 830 520 L 780 540 Z"/>
                        <text class="association-text" x="780" y="525" text-anchor="middle">CONTIENT</text>
                        
                        <!-- POSSEDE Association -->
                        <path class="association" d="M 280 750 L 330 730 L 380 750 L 330 770 Z"/>
                        <text class="association-text" x="330" y="755" text-anchor="middle">POSSEDE</text>
                        
                        <!-- RESPONSABLE_DE Association -->
                        <path class="association" d="M 250 550 L 300 530 L 350 550 L 300 570 Z"/>
                        <text class="association-text" x="300" y="545" text-anchor="middle">RESPONSA</text>
                        <text class="association-text" x="300" y="560" text-anchor="middle">BLE_DE</text>
                        
                        <!-- SOUFFRE_DE Association -->
                        <path class="association" d="M 700 800 L 750 780 L 800 800 L 750 820 Z"/>
                        <text class="association-text" x="750" y="795" text-anchor="middle">SOUFFRE</text>
                        <text class="association-text" x="750" y="810" text-anchor="middle">_DE</text>
                        <text class="attribute-text" x="705" y="840" style="font-style: italic; font-size: 10px;">date_debut</text>
                        
                        <!-- Lines -->
                        <line class="relation-line" x1="250" y1="320" x2="430" y2="320"/>
                        <text class="cardinality-text" x="255" y="315">(0,n)</text>
                        <line class="relation-line" x1="480" y1="340" x2="480" y2="400"/>
                        <text class="cardinality-text" x="455" y="385">(1,1)</text>
                        
                        <line class="relation-line" x1="950" y1="320" x2="830" y2="380"/>
                        <text class="cardinality-text" x="955" y="315">(1,1)</text>
                        <line class="relation-line" x1="880" y1="400" x2="700" y2="430"/>
                        <text class="cardinality-text" x="710" y="425">(1,n)</text>
                        
                        <line class="relation-line" x1="950" y1="320" x2="1010" y2="380"/>
                        <text class="cardinality-text" x="955" y="340">(0,n)</text>
                        <line class="relation-line" x1="1010" y1="420" x2="960" y2="550"/>
                        <text class="cardinality-text" x="965" y="540">(1,1)</text>
                        
                        <line class="relation-line" x1="700" y1="455" x2="730" y2="520"/>
                        <text class="cardinality-text" x="705" y="475">(1,n)</text>
                        <line class="relation-line" x1="830" y1="520" x2="850" y2="600"/>
                        <text class="cardinality-text" x="835" y="590">(1,1)</text>
                        
                        <line class="relation-line" x1="250" y1="750" x2="280" y2="750"/>
                        <text class="cardinality-text" x="255" y="745">(1,1)</text>
                        <line class="relation-line" x1="380" y1="750" x2="450" y2="750"/>
                        <text class="cardinality-text" x="420" y="745">(1,1)</text>
                        
                        <line class="relation-line" x1="250" y1="320" x2="300" y2="530"/>
                        <text class="cardinality-text" x="255" y="340">(1,n)</text>
                        <line class="relation-line" x1="350" y1="550" x2="450" y2="700"/>
                        <text class="cardinality-text" x="410" y="690">(1,1)</text>
                        
                        <line class="relation-line" x1="650" y1="800" x2="700" y2="800"/>
                        <text class="cardinality-text" x="655" y="795">(0,n)</text>
                        <line class="relation-line" x1="800" y1="800" x2="850" y2="800"/>
                        <text class="cardinality-text" x="820" y="795">(0,n)</text>
                    </svg>
                
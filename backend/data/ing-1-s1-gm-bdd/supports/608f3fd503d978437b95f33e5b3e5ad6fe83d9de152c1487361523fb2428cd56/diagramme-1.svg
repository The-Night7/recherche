<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
                        <!-- ETUDIANT -->
                        <rect class="entity" x="50" y="50" width="180" height="120" rx="5"/>
                        <text class="entity-text" x="140" y="75" text-anchor="middle">ETUDIANT</text>
                        <line x1="50" y1="85" x2="230" y2="85" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="60" y="100">#id_etudiant</text>
                        <text class="attribute-text" x="60" y="115">nom, prenom</text>
                        <text class="attribute-text" x="60" y="130">date_naissance</text>
                        <text class="attribute-text" x="60" y="145">email, adresse</text>
                        
                        <!-- PROMOTION -->
                        <rect class="entity" x="500" y="50" width="180" height="100" rx="5"/>
                        <text class="entity-text" x="590" y="75" text-anchor="middle">PROMOTION</text>
                        <line x1="500" y1="85" x2="680" y2="85" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="510" y="100">#libelle</text>
                        <text class="attribute-text" x="510" y="115">ordre</text>
                        
                        <!-- CYCLE -->
                        <rect class="entity" x="950" y="50" width="180" height="100" rx="5"/>
                        <text class="entity-text" x="1040" y="75" text-anchor="middle">CYCLE</text>
                        <line x1="950" y1="85" x2="1130" y2="85" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="960" y="100">#nom_cycle</text>
                        <text class="attribute-text" x="960" y="115">description</text>
                        
                        <!-- MATIERE -->
                        <rect class="entity" x="500" y="300" width="180" height="110" rx="5"/>
                        <text class="entity-text" x="590" y="325" text-anchor="middle">MATIERE</text>
                        <line x1="500" y1="335" x2="680" y2="335" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="510" y="350">#id_matiere</text>
                        <text class="attribute-text" x="510" y="365">libelle</text>
                        <text class="attribute-text" x="510" y="380">duree, syllabus</text>
                        
                        <!-- PROFESSEUR -->
                        <rect class="entity" x="950" y="300" width="180" height="130" rx="5"/>
                        <text class="entity-text" x="1040" y="325" text-anchor="middle">PROFESSEUR</text>
                        <line x1="950" y1="335" x2="1130" y2="335" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="960" y="350">#id_prof</text>
                        <text class="attribute-text" x="960" y="365">nom, prenom</text>
                        <text class="attribute-text" x="960" y="380">email</text>
                        <text class="attribute-text" x="960" y="395">specialite</text>
                        <text class="attribute-text" x="960" y="410">adresse</text>
                        
                        <!-- LIVRE -->
                        <rect class="entity" x="50" y="550" width="180" height="120" rx="5"/>
                        <text class="entity-text" x="140" y="575" text-anchor="middle">LIVRE</text>
                        <line x1="50" y1="585" x2="230" y2="585" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="60" y="600">#num_livre</text>
                        <text class="attribute-text" x="60" y="615">titre, editeur</text>
                        <text class="attribute-text" x="60" y="630">annee_edition</text>
                        <text class="attribute-text" x="60" y="645">ISBN</text>
                        
                        <!-- MOT_CLE -->
                        <rect class="entity" x="500" y="550" width="180" height="80" rx="5"/>
                        <text class="entity-text" x="590" y="575" text-anchor="middle">MOT_CLE</text>
                        <line x1="500" y1="585" x2="680" y2="585" stroke="#1976d2" stroke-width="1"/>
                        <text class="attribute-text primary-key" x="510" y="600">#mot</text>
                        
                        <!-- Association EST_INSCRIT -->
                        <path class="association" d="M 280 100 L 330 80 L 380 100 L 330 120 Z"/>
                        <text class="association-text" x="330" y="98" text-anchor="middle">EST_INSCRIT</text>
                        <text class="attribute-text" x="300" y="140" style="font-style: italic; font-size: 10px;">annee_scolaire</text>
                        <text class="attribute-text" x="315" y="152" style="font-style: italic; font-size: 10px;">statut</text>
                        
                        <!-- Association APPARTIENT_A -->
                        <path class="association" d="M 730 100 L 780 80 L 830 100 L 780 120 Z"/>
                        <text class="association-text" x="780" y="105" text-anchor="middle">APPARTIENT_A</text>
                        
                        <!-- Association EST_ENSEIGNEE_DANS -->
                        <path class="association" d="M 590 200 L 640 180 L 690 200 L 640 220 Z"/>
                        <text class="association-text" x="640" y="195" text-anchor="middle">EST_ENSEIG</text>
                        <text class="association-text" x="640" y="208" text-anchor="middle">NEE_DANS</text>
                        
                        <!-- Association ENSEIGNE -->
                        <path class="association" d="M 730 355 L 780 335 L 830 355 L 780 375 Z"/>
                        <text class="association-text" x="780" y="360" text-anchor="middle">ENSEIGNE</text>
                        
                        <!-- Association CONCERNE -->
                        <path class="association" d="M 330 450 L 380 430 L 430 450 L 380 470 Z"/>
                        <text class="association-text" x="380" y="455" text-anchor="middle">CONCERNE</text>
                        
                        <!-- Association EST_ASSOCIE_A -->
                        <path class="association" d="M 280 590 L 330 570 L 380 590 L 330 610 Z"/>
                        <text class="association-text" x="330" y="588" text-anchor="middle">EST_ASSO</text>
                        <text class="association-text" x="330" y="601" text-anchor="middle">CIE_A</text>
                        
                        <!-- Lines -->
                        <line class="relation-line" x1="230" y1="100" x2="280" y2="100"/>
                        <text class="cardinality-text" x="235" y="95">(1,n)</text>
                        <line class="relation-line" x1="380" y1="100" x2="500" y2="100"/>
                        <text class="cardinality-text" x="475" y="95">(1,n)</text>
                        
                        <line class="relation-line" x1="680" y1="100" x2="730" y2="100"/>
                        <text class="cardinality-text" x="685" y="95">(1,1)</text>
                        <line class="relation-line" x1="830" y1="100" x2="950" y2="100"/>
                        <text class="cardinality-text" x="920" y="95">(1,n)</text>
                        
                        <line class="relation-line" x1="590" y1="150" x2="640" y2="180"/>
                        <text class="cardinality-text" x="595" y="170">(1,n)</text>
                        <line class="relation-line" x1="640" y1="220" x2="590" y2="300"/>
                        <text class="cardinality-text" x="595" y="290">(1,n)</text>
                        
                        <line class="relation-line" x1="680" y1="355" x2="730" y2="355"/>
                        <text class="cardinality-text" x="685" y="350">(1,n)</text>
                        <line class="relation-line" x1="830" y1="355" x2="950" y2="365"/>
                        <text class="cardinality-text" x="920" y="360">(1,n)</text>
                        
                        <line class="relation-line" x1="230" y1="610" x2="280" y2="590"/>
                        <text class="cardinality-text" x="235" y="605">(1,n)</text>
                        <line class="relation-line" x1="380" y1="590" x2="500" y2="590"/>
                        <text class="cardinality-text" x="475" y="585">(1,n)</text>
                        
                        <line class="relation-line" x1="140" y1="430" x2="380" y2="450"/>
                        <text class="cardinality-text" x="145" y="435">(1,n)</text>
                        <line class="relation-line" x1="430" y1="450" x2="590" y2="410"/>
                        <text class="cardinality-text" x="565" y="420">(0,n)</text>
                        
                        <!-- PRE_REQUIS réflexive sur MATIERE -->
                        <path class="relation-line" d="M 680 355 Q 750 355 750 300 Q 750 245 680 245" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
                        <text class="association-text" x="760" y="310" style="font-size: 11px;">PRE_REQUIS</text>
                        <text class="cardinality-text" x="690" y="360">(0,n)</text>
                        <text class="cardinality-text" x="690" y="250">(0,n)</text>
                    </svg>
                
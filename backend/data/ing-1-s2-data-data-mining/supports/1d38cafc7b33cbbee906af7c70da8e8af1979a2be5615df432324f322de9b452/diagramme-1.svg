<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;display:block;margin:0 auto">
          <!-- Axes -->
          <line x1="70" y1="280" x2="640" y2="280" stroke="#2a3050" stroke-width="1.5"/>
          <line x1="70" y1="280" x2="70" y2="30" stroke="#2a3050" stroke-width="1.5"/>

          <!-- Y axis labels -->
          <text x="60" y="283" fill="#546e7a" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">0</text>
          <text x="60" y="248" fill="#546e7a" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">1</text>
          <text x="60" y="196" fill="#546e7a" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">3</text>
          <text x="60" y="126" fill="#546e7a" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">7</text>
          <text x="60" y="92" fill="#546e7a" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">8</text>

          <!-- Y gridlines -->
          <line x1="70" y1="248" x2="640" y2="248" stroke="#1f2435" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="70" y1="196" x2="640" y2="196" stroke="#1f2435" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="70" y1="126" x2="640" y2="126" stroke="#1f2435" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="70" y1="92" x2="640" y2="92" stroke="#1f2435" stroke-width="1" stroke-dasharray="4,4"/>

          <!-- Leaf labels (x-axis) -->
          <text x="150" y="300" fill="#8892a8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">x₁=1</text>
          <text x="260" y="300" fill="#8892a8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">x₂=2</text>
          <text x="370" y="300" fill="#8892a8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">x₃=9</text>
          <text x="480" y="300" fill="#8892a8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">x₄=12</text>
          <text x="590" y="300" fill="#8892a8" font-size="12" text-anchor="middle" font-family="Outfit,sans-serif">x₅=20</text>

          <!-- Leaf stems -->
          <line x1="150" y1="248" x2="150" y2="280" stroke="#5b8dee" stroke-width="2"/>
          <line x1="260" y1="248" x2="260" y2="280" stroke="#5b8dee" stroke-width="2"/>
          <line x1="370" y1="196" x2="370" y2="280" stroke="#3ecf8e" stroke-width="2"/>
          <line x1="480" y1="196" x2="480" y2="280" stroke="#3ecf8e" stroke-width="2"/>
          <line x1="590" y1="92" x2="590" y2="280" stroke="#f7c948" stroke-width="2"/>

          <!-- Step 1: Fusion x1,x2 at height 1 -->
          <line x1="150" y1="248" x2="260" y2="248" stroke="#5b8dee" stroke-width="2.5"/>
          <line x1="205" y1="248" x2="205" y2="126" stroke="#5b8dee" stroke-width="2"/>

          <!-- Step 2: Fusion x3,x4 at height 3 -->
          <line x1="370" y1="196" x2="480" y2="196" stroke="#3ecf8e" stroke-width="2.5"/>
          <line x1="425" y1="196" x2="425" y2="126" stroke="#3ecf8e" stroke-width="2"/>

          <!-- Step 3: Fusion C12,C34 at height 7 -->
          <line x1="205" y1="126" x2="425" y2="126" stroke="#c792ea" stroke-width="2.5"/>
          <line x1="315" y1="126" x2="315" y2="92" stroke="#c792ea" stroke-width="2"/>

          <!-- Step 4: Fusion all at height 8 -->
          <line x1="315" y1="92" x2="590" y2="92" stroke="#f7c948" stroke-width="2.5"/>
          <line x1="452" y1="92" x2="452" y2="50" stroke="#f7c948" stroke-width="2"/>

          <!-- Cut line suggestion -->
          <line x1="70" y1="155" x2="640" y2="155" stroke="#e05c7a" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
          <text x="645" y="159" fill="#e05c7a" font-size="10" font-family="Outfit,sans-serif">coupe k=3</text>

          <!-- Height annotations -->
          <text x="270" y="244" fill="#5b8dee" font-size="10" font-family="JetBrains Mono,monospace">h=1</text>
          <text x="490" y="192" fill="#3ecf8e" font-size="10" font-family="JetBrains Mono,monospace">h=3</text>
          <text x="320" y="122" fill="#c792ea" font-size="10" font-family="JetBrains Mono,monospace">h=7</text>
          <text x="455" y="88" fill="#f7c948" font-size="10" font-family="JetBrains Mono,monospace">h=8</text>

          <!-- Y axis label -->
          <text x="30" y="155" fill="#546e7a" font-size="11" text-anchor="middle" transform="rotate(-90,30,155)" font-family="Outfit,sans-serif">Distance (min)</text>
        </svg>
      